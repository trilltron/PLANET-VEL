name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S . -B build -A x64 -DPV_BUILD_TESTS=ON "-DCMAKE_CXX_FLAGS=-MP -EHsc" "-DCMAKE_C_FLAGS=-MP"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPV_BUILD_TESTS=OFF
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build (VST3 only on Windows/macOS)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then cmake --build build --config Release --parallel;
          else cmake --build build --config Release --target PlanetVel_VST3 PlanetVel_Standalone --parallel; fi
      - name: Headless tests (Linux)
        if: runner.os == 'Linux'
        run: |
          B=build/PlanetVelTests_artefacts/Release/PlanetVelTests
          $B export /tmp/presets && $B render 12 && $B stress
          xvfb-run -a $B vst3 "build/PlanetVel_artefacts/Release/VST3/Planet Vel.vst3"
      - name: Smoke-test the standalone app (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "$PWD\build\PlanetVel_artefacts\Release\Standalone\Planet Vel.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Host "APP EXITED EARLY, exit code: $($p.ExitCode) (0x$('{0:X}' -f $p.ExitCode))" } else { Write-Host "APP IS RUNNING after 12 s, main window title: '$($p.MainWindowTitle)'"; Stop-Process -Id $p.Id -Force }
          $log = "$env:APPDATA\Trill Tron\Planet Vel\planetvel.log"
          if (Test-Path $log) { Write-Host '---- planetvel.log ----'; Get-Content $log } else { Write-Host 'NO planetvel.log was written (crashed before the processor was created)' }
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error'; StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue | ForEach-Object { $_.Message } | Select-Object -First 3
      - name: Package Windows VST2 .dll (same binary also exports VSTPluginMain)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p pkg
          cp "build/PlanetVel_artefacts/Release/VST3/Planet Vel.vst3/Contents/x86_64-win/Planet Vel.vst3" "pkg/Planet Vel.dll"
          grep -aq VSTPluginMain "pkg/Planet Vel.dll" || { echo 'VSTPluginMain export missing'; exit 1; }
      - name: GATE - binaries must not depend on the system C++ runtime (static /MT)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for f in "build/PlanetVel_artefacts/Release/Standalone/Planet Vel.exe" "build/PlanetVel_artefacts/Release/VST3/Planet Vel.vst3/Contents/x86_64-win/Planet Vel.vst3"; do
            if grep -aq "MSVCP140.dll" "$f" || grep -aq "VCRUNTIME140.dll" "$f"; then echo "DYNAMIC RUNTIME still linked in: $f"; exit 1; fi
            echo "static runtime OK: $f"
          done
      - name: Build test harness (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: cmake --build build --config Release --target PlanetVelTests --parallel
      - name: Load the real VST2 .dll like FL does and open its editor (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $t = Get-ChildItem -Recurse build -Filter PlanetVelTests.exe | Select-Object -First 1
          if (-not $t) { Write-Host 'harness exe not found'; exit 0 }
          & $t.FullName vst2dll "$PWD\pkg\Planet Vel.dll"
          Write-Host "harness exit code: $LASTEXITCODE (0x$('{0:X}' -f $LASTEXITCODE))"
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DRepo=$PWD" "/DDll=$PWD\pkg\Planet Vel.dll" "/DVst3=$PWD\build\PlanetVel_artefacts\Release\VST3\Planet Vel.vst3" "/DApp=$PWD\build\PlanetVel_artefacts\Release\Standalone\Planet Vel.exe" Installer\windows\PlanetVel.iss
          if (-not (Test-Path pkg\PlanetVel-Setup.exe)) { throw "installer not produced" }
      - name: Zip and publish a public release (Windows)
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rel
          7z a rel/PlanetVel-Windows-Installer.zip ./pkg/PlanetVel-Setup.exe
          7z a rel/PlanetVel-Windows-VST2-dll.zip "./pkg/Planet Vel.dll"
          7z a rel/PlanetVel-Windows-VST3.zip "./build/PlanetVel_artefacts/Release/VST3/Planet Vel.vst3"
          7z a rel/PlanetVel-Windows-App.zip "./build/PlanetVel_artefacts/Release/Standalone/Planet Vel.exe"
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "PLANET VEL latest build" --notes "Automatic build of the main branch. Download a zip, unzip it, run the installer (or copy the plugin)." --target "$GITHUB_SHA"
          gh release upload latest rel/*.zip --clobber
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: PlanetVel-Windows-Installer
          path: pkg/PlanetVel-Setup.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: PlanetVel-Windows-App
          path: build/PlanetVel_artefacts/Release/Standalone/Planet Vel.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: PlanetVel-Windows-VST2-dll
          path: pkg/Planet Vel.dll
      - uses: actions/upload-artifact@v4
        with:
          name: PlanetVel-${{ runner.os }}
          path: |
            build/PlanetVel_artefacts/Release/VST3
            build/PlanetVel_artefacts/Release/AU
      - name: pluginval (strictness 5, optional)
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   U=pluginval_Linux.zip ;;
            Windows) U=pluginval_Windows.zip ;;
            macOS)   U=pluginval_macOS.zip ;;
          esac
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$U" && unzip -q pv.zip
          P=$(find build -name "Planet Vel.vst3" -maxdepth 5 | head -1)
          if [ "${{ runner.os }}" = "Linux" ]; then xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process "$P";
          elif [ "${{ runner.os }}" = "Windows" ]; then ./pluginval.exe --strictness-level 5 --validate-in-process "$P";
          else ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process "$P"; fi

  win32:
    # 32-bit Windows build (for the 32-bit FL Studio / 32-bit hosts). Published as its own zip on the "latest" release.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Win32)
        shell: bash
        run: cmake -S . -B build32 -A Win32 -DPV_BUILD_TESTS=ON "-DCMAKE_CXX_FLAGS=-MP -EHsc" "-DCMAKE_C_FLAGS=-MP"
      - name: Build (Win32 VST3 / VST2 dll + standalone)
        shell: bash
        run: cmake --build build32 --config Release --target PlanetVel_VST3 PlanetVel_Standalone --parallel
      - name: GATE - binaries must not depend on the system C++ runtime (static /MT)
        shell: bash
        run: |
          for f in "build32/PlanetVel_artefacts/Release/Standalone/Planet Vel.exe" "build32/PlanetVel_artefacts/Release/VST3/Planet Vel.vst3/Contents/x86-win/Planet Vel.vst3"; do
            if grep -aq "MSVCP140.dll" "$f" || grep -aq "VCRUNTIME140.dll" "$f"; then echo "DYNAMIC RUNTIME still linked in: $f"; exit 1; fi
            echo "static runtime OK: $f"
          done
      - name: Build test harness (Win32)
        shell: bash
        run: cmake --build build32 --config Release --target PlanetVelTests --parallel
      - name: Package
        shell: bash
        run: |
          mkdir -p rel32/dll rel32/app
          DLL=$(find build32/PlanetVel_artefacts/Release/VST3 -name "Planet Vel.vst3" -type f | head -1)
          echo "inner binary: $DLL"
          cp "$DLL" "rel32/dll/Planet Vel.dll"
          grep -aq VSTPluginMain "rel32/dll/Planet Vel.dll" || { echo 'VSTPluginMain export missing'; exit 1; }
          cp "build32/PlanetVel_artefacts/Release/Standalone/Planet Vel.exe" "rel32/app/Planet Vel.exe"
          mkdir -p rel
          7z a "rel/PlanetVel-Windows-32bit-VST2-dll.zip" "./rel32/dll/Planet Vel.dll"
          7z a "rel/PlanetVel-Windows-32bit-App.zip" "./rel32/app/Planet Vel.exe"
      - name: GATE - load the 32-bit dll like FL does and open its editor (fails the job if it crashes)
        shell: pwsh
        run: |
          $t = Get-ChildItem -Recurse build32 -Filter PlanetVelTests.exe | Select-Object -First 1
          & $t.FullName vst2dll "$PWD\rel32\dll\Planet Vel.dll"
          Write-Host "exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "32-bit dll failed the load/open test" }
      - name: GATE - the 32-bit standalone must start and stay running
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\rel32\app\Planet Vel.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "32-bit app exited early, code $($p.ExitCode)" } else { Write-Host "32-bit app running, window '$($p.MainWindowTitle)'"; Stop-Process -Id $p.Id -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: PlanetVel-Windows-32bit
          path: rel/*.zip
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "PLANET VEL latest build" --notes "Automatic build of the main branch." --target "$GITHUB_SHA" || true
          gh release upload latest rel/*.zip --clobber
